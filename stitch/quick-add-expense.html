<!-- Quick Note & Date Selection Row -->
<div class="grid grid-cols-12 gap-2">

<span class="material-symbols-outlined text-outline text-lg">edit_note</span>
<input class="w-full bg-transparent font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none" id="expense-note" placeholder="What was this for?" type="text" value="Coffee &amp; Pastry"/>
</div>

<span class="material-symbols-outlined text-primary text-base">calendar_today</span>

</button>

<!-- Ergonomic Numeric Touch Keypad (3x4 Layout with >48px Targets) -->
<div class="bg-surface-container-lowest rounded-xl p-3 shadow-sm">
<div class="grid grid-cols-3 gap-2 text-center" id="keypad">
<button class="key-btn h-13 min-h-[52px] rounded-xl bg-surface-container-low hover:bg-surface-container active:scale-95 transition-all flex items-center justify-center font-metric-bold text-metric-bold text-on-surface" data-val="1">1</button>
<button class="key-btn h-13 min-h-[52px] rounded-xl bg-surface-container-low hover:bg-surface-container active:scale-95 transition-all flex items-center justify-center font-metric-bold text-metric-bold text-on-surface" data-val="2">2</button>
<button class="key-btn h-13 min-h-[52px] rounded-xl bg-surface-container-low hover:bg-surface-container active:scale-95 transition-all flex items-center justify-center font-metric-bold text-metric-bold text-on-surface" data-val="3">3</button>
<button class="key-btn h-13 min-h-[52px] rounded-xl bg-surface-container-low hover:bg-surface-container active:scale-95 transition-all flex items-center justify-center font-metric-bold text-metric-bold text-on-surface" data-val="4">4</button>
<button class="key-btn h-13 min-h-[52px] rounded-xl bg-surface-container-low hover:bg-surface-container active:scale-95 transition-all flex items-center justify-center font-metric-bold text-metric-bold text-on-surface" data-val="5">5</button>
<button class="key-btn h-13 min-h-[52px] rounded-xl bg-surface-container-low hover:bg-surface-container active:scale-95 transition-all flex items-center justify-center font-metric-bold text-metric-bold text-on-surface" data-val="6">6</button>

<button class="key-btn h-13 min-h-[52px] rounded-xl bg-surface-container-low hover:bg-surface-container active:scale-95 transition-all flex items-center justify-center font-metric-bold text-metric-bold text-on-surface" data-val="9">9</button>

<button class="key-btn h-13 min-h-[52px] rounded-xl bg-surface-container-low hover:bg-surface-container active:scale-95 transition-all flex items-center justify-center font-metric-bold text-metric-bold text-on-surface" data-val="0">0</button>

<span class="material-symbols-outlined text-xl" style="font-variation-settings: 'FILL' 1;">bolt</span>

<span class="material-symbols-outlined text-lg opacity-80">check</span>
</button>

<!-- Micro Toast Feedback Notification (hidden initially) -->
<div class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-inverse-surface text-inverse-on-surface px-4 py-2.5 rounded-full shadow-xl flex items-center gap-2 opacity-0 pointer-events-none transition-all duration-300 transform translate-y-3 z-50" id="toast-feedback">
<span class="material-symbols-outlined text-secondary-container text-lg" style="font-variation-settings: 'FILL' 1;">cloud_done</span>
<span class="font-label-sm text-label-sm font-medium">Logged &amp; saved locally in 180ms</span>
</div>
</div>
<script>
  (() => {
    let currentAmount = "15.50";
    const amountEl = document.getElementById("amount-text");
    const clearBtn = document.getElementById("clear-btn");
    const keypad = document.getElementById("keypad");
    const saveBtn = document.getElementById("save-btn");
    const toast = document.getElementById("toast-feedback");
    const dateBtn = document.getElementById("date-pill");
    const dateLabel = document.getElementById("date-label");
    const categoryContainer = document.getElementById("category-container");

    function renderAmount() {
      amountEl.textContent = currentAmount || "0";
    }

    keypad.addEventListener("click", (e) => {
      const btn = e.target.closest("button");
      if (!btn) return;

      const val = btn.getAttribute("data-val");
      const action = btn.getAttribute("data-action");

      if (action === "backspace") {
        if (currentAmount.length > 0) {
          currentAmount = currentAmount.slice(0, -1);
        }
      } else if (val) {
        if (val === ".") {
          if (!currentAmount.includes(".")) {
            currentAmount = currentAmount === "" ? "0." : currentAmount + ".";
          }
        } else {
          // Check decimal places max 2
          const parts = currentAmount.split(".");
          if (parts.length > 1 && parts[1].length >= 2) {
            return;
          }
          if (currentAmount === "0") {
            currentAmount = val;
          } else if (currentAmount.length < 9) {
            currentAmount += val;
          }
        }
      }
      renderAmount();
    });

    clearBtn.addEventListener("click", () => {
      currentAmount = "";
      renderAmount();
    });

    // Toggle categories
    categoryContainer.addEventListener("click", (e) => {
      const btn = e.target.closest(".cat-pill");
      if (!btn) return;
      document.querySelectorAll(".cat-pill").forEach(c => {
        c.classList.remove("bg-primary", "text-on-primary");
        c.classList.add("bg-surface-container-lowest", "text-on-surface");
      });
      btn.classList.remove("bg-surface-container-lowest", "text-on-surface", "bg-surface-container", "text-primary");
      btn.classList.add("bg-primary", "text-on-primary");
    });

    // Date cycle micro-interaction (Today -> Yesterday -> May 20)
    const dates = ["Today", "Yesterday", "May 20"];
    let dateIdx = 0;
    dateBtn.addEventListener("click", () => {
      dateIdx = (dateIdx + 1) % dates.length;
      dateLabel.textContent = dates[dateIdx];
    });

    // Rapid save action with tactile feedback
    saveBtn.addEventListener("click", () => {
      toast.classList.remove("opacity-0", "translate-y-3", "pointer-events-none");
      toast.classList.add("opacity-100", "translate-y-0");

      saveBtn.disabled = true;
      saveBtn.classList.add("opacity-75");

      setTimeout(() => {
        toast.classList.add("opacity-0", "translate-y-3", "pointer-events-none");
        toast.classList.remove("opacity-100", "translate-y-0");
        saveBtn.disabled = false;
        saveBtn.classList.remove("opacity-75");
      }, 2000);
    });
  })();
</script></main></body></html>
