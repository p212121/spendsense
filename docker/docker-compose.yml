version: '3.8'

services:
  # SpendSense AI FastAPI Service
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: spendsense-ai-api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - spendsense-net

networks:
  spendsense-net:
    driver: bridge
